version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shopyverse
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shopyverse_core
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: